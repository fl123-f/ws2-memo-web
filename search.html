<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>検索 - 学習メモ＆資料整理</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="search-page">
    <div class="container search-container">
        <div class="page-header">
            <div class="header-top">
                <div>
                    <h1>🔍 笔记搜索</h1>
                    <p>搜索您的学习笔记和资料</p>
                </div>
                <div class="theme-toggle-container">
                    <select id="theme-select" class="theme-select" title="テーマ選択">
                        <option value="light">☀️ ライトモード</option>
                        <option value="dark">🌙 ダークモード</option>
                        <option value="auto">🔄 システムに合わせる</option>
                    </select>
                </div>
            </div>
            <a href="index.html" class="btn btn-link back-link">← 返回笔记列表</a>
        </div>
        <form id="search-form" class="search-form">
            <input type="text" name="keyword" placeholder="输入关键词搜索笔记..." autofocus class="search-input">
            <button type="submit" class="btn btn-primary">検索</button>
        </form>

        <div id="search-results" class="search-results">
            <!-- 搜索结果将在这里显示 -->
        </div>

    <script type="module" src="js/pages/search.js"></script>
</body>
</html>
